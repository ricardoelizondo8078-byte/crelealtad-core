databases:
  - name: crelealtad-postgres
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: crelealtad
    user: crelealtad_app
    diskSizeGB: 15
    ipAllowList: []

services:
  - type: web
    runtime: node
    name: crelealtad-api
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm --prefix apps/api ci && npm --prefix apps/api run build
    preDeployCommand: npm --prefix apps/api run db:deploy
    startCommand: npm --prefix apps/api run start:prod
    healthCheckPath: /health
    disk:
      name: crelealtad-evidencias
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_NAME
        value: crelealtad
      - key: DATABASE_URL
        fromDatabase:
          name: crelealtad-postgres
          property: connectionString
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://crelealtad-web.onrender.com
      - key: DOCUMENT_STORAGE_PATH
        value: /var/data/documentos
      - key: VERIFICACION_STORAGE_PATH
        value: /var/data/verificacion
      - key: PRODUCTION_DB_BOOTSTRAP_CONFIRM
        value: crelealtad
      - key: MIGRATION_APPLY_CONFIRM
        value: crelealtad

  - type: web
    runtime: static
    name: crelealtad-web
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: ./dist
    rootDir: apps/mobile
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://crelealtad-api.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
